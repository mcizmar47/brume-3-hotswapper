name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BrumeHotswapper.slnx
      - run: dotnet build BrumeHotswapper.slnx -c Release --no-restore
      - run: dotnet test installer/tests/BrumeHotswapper.Tests.csproj -c Release --no-restore

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 installer/tests/test_coordination.py
      - run: python3 installer/tests/test_runtime_config.py
      - run: python3 installer/tests/test_static_correctness.py
